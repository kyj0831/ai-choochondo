<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>운세 라운지</title>
<meta name="description" content="사주·토정비결·궁합·타로·오늘의 운세. 만세력으로 계산하고 AI가 풀어 드립니다.">
<meta property="og:title" content="운세 라운지">
<meta property="og:description" content="사주·토정비결·궁합·타로·오늘의 운세. 오늘을 건너는 한 줄의 위로.">
<meta name="theme-color" content="#2B4C7E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='none' stroke='%23A8392E' stroke-width='5'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23A8392E' font-family='serif'%3E%E9%81%8B%3C/text%3E%3C/svg%3E">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 책력(almanac) 한 권 — 상단 제호 + 탭, 좌측 입력지 / 우측 명식·풀이. 오방색은 오행 표시에만 쓴다. */
:root {
  --paper: #EDF0EA;      /* 옅은 청자빛 한지 */
  --sheet: #F8F9F5;
  --ink: #1C2421;
  --ink-soft: #55615B;
  --rule: #CBD3CC;
  --accent: #2B4C7E;     /* 쪽빛 */
  --accent-ink: #F8F9F5;
  --seal: #A8392E;
  --wood: #3E7B5A; --fire: #C2463B; --earth: #B0832A; --metal: #7D848E; --water: #24385A;
  --f-display: "Song Myung", "Nanum Myeongjo", serif;
  --f-head: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141A19; --sheet: #1C2422; --ink: #E4E9E4; --ink-soft: #9EABA4; --rule: #33403C;
  --accent: #8FB0E3; --accent-ink: #10161A; --seal: #E07A6C;
  --wood: #6FB38D; --fire: #E5766A; --earth: #D9AE55; --metal: #AEB5BE; --water: #8AA6D6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #141A19; --sheet: #1C2422; --ink: #E4E9E4; --ink-soft: #9EABA4; --rule: #33403C;
  --accent: #8FB0E3; --accent-ink: #10161A; --seal: #E07A6C;
  --wood: #6FB38D; --fire: #E5766A; --earth: #D9AE55; --metal: #AEB5BE; --water: #8AA6D6;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.7 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }
h1, h2, h3, h4 { font-family: var(--f-head); text-wrap: balance; margin: 0; line-height: 1.35 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* 제호 */
.mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.brand { display: flex; align-items: center; gap: 14px }
.seal { width: 52px; height: 52px; border: 2px solid var(--seal); color: var(--seal); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 19px/1 var(--f-display); transform: rotate(-3deg) }
.brand h1 { font: 34px/1.1 var(--f-display); letter-spacing: 1px }
.brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px }
.today { text-align: right; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums }
.today b { display: block; font: 20px/1.3 var(--f-display); color: var(--ink) }

nav.tabs { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 6px 0 28px; border-bottom: 1px solid var(--rule) }
nav.tabs button { background: none; border: 0; padding: 12px 0 10px; cursor: pointer; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
nav.tabs .tag { font-size: 11px; color: var(--accent); margin-left: 4px; letter-spacing: .5px }

.grid { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 32px; align-items: start }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.panel-intro { margin-bottom: 18px; max-width: 62ch }
.panel-intro h2 { font-size: 24px }
.panel-intro p { margin: 4px 0 0; color: var(--ink-soft) }

form.sheet, .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 20px }
form.sheet { display: grid; gap: 14px }
label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-soft); font-weight: 500 }
input, select, textarea { background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 10px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 72px }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400 }
.check input { width: auto }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 3px; padding: 11px 16px; font-weight: 600; cursor: pointer }
.btn:disabled { opacity: .5; cursor: default }
.btn.ghost { background: none; color: var(--accent); border: 1px solid var(--accent) }
.hint { font-size: 12px; color: var(--ink-soft); margin: 0 }
.example { display: inline-block; font-size: 11px; letter-spacing: .5px; color: var(--seal); border: 1px solid var(--seal); border-radius: 2px; padding: 0 6px; margin-left: 6px; vertical-align: 2px }

/* 명식 */
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--ink); border-radius: 2px; overflow: hidden }
.pillar { border-left: 1px solid var(--rule); text-align: center }
.pillar:first-child { border-left: 0 }
.pillar .cap { font-size: 12px; color: var(--ink-soft); padding: 6px 0; border-bottom: 1px solid var(--rule); letter-spacing: 1px }
.pillar.me .cap { color: var(--accent); font-weight: 600 }
.cell { padding: 10px 4px 8px; border-bottom: 1px solid var(--rule) }
.cell:last-child { border-bottom: 0 }
.cell .han { font: clamp(30px, 6vw, 44px)/1.1 var(--f-display) }
.cell .rd { font-size: 12px; color: var(--ink-soft) }
.cell .el { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 2px; color: var(--sheet); margin-top: 4px }
.pillar.empty .han { color: var(--rule) }
.e0 { --c: var(--wood) } .e1 { --c: var(--fire) } .e2 { --c: var(--earth) } .e3 { --c: var(--metal) } .e4 { --c: var(--water) }
.cell .han { color: var(--c, var(--ink)) }
.cell .el { background: var(--c) }

.balance { display: grid; gap: 8px; margin-top: 18px }
.bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 28px; align-items: center; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums }
.bar .track { height: 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 1px; overflow: hidden }
.bar .fill { height: 100%; background: var(--c) }
.bar .nm { font-family: var(--f-display); font-size: 16px; color: var(--c); white-space: nowrap }

.result h3 { font-size: 19px; margin-bottom: 4px }
.result .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 16px }
.reading { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 18px; max-width: 68ch }
.reading h4 { font-size: 16px; margin: 16px 0 4px; color: var(--accent) }
.reading h4:first-child { margin-top: 0 }
.reading p { margin: 0 0 8px }
.ai-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px }
.ai-bar .status { font-size: 13px; color: var(--ink-soft) }
.ai-out { white-space: normal }
.ai-out.thinking { color: var(--ink-soft); font-style: italic }

/* 궁합 */
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
.score b { font: 64px/1 var(--f-display); color: var(--seal); font-variant-numeric: tabular-nums }
.pair { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; align-items: center; margin: 16px 0 }
.pair .who { text-align: center; padding: 12px; border: 1px solid var(--rule); border-radius: 3px }
.pair .who .han { font: 40px/1.1 var(--f-display) }
.pair .who .han { color: var(--c) }
.pair .rel { font-size: 13px; color: var(--ink-soft); text-align: center }
ul.facts { margin: 0; padding-left: 18px }
ul.facts li { margin-bottom: 4px }

/* 타로 */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-top: 14px }
.deck button { aspect-ratio: 2/3; max-width: 100%; border: 1px solid var(--accent); border-radius: 4px; cursor: pointer; padding: 0;
  background: repeating-linear-gradient(45deg, var(--accent) 0 3px, transparent 3px 9px), var(--sheet); transition: transform .15s }
.deck button:hover { transform: translateY(-3px) }
.deck button:disabled { opacity: .18; cursor: default; transform: none }
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.slot { text-align: center }
.slot .pos { font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; margin-bottom: 6px }
.card { aspect-ratio: 2/3; max-width: 100%; border: 1px solid var(--rule); border-radius: 6px; display: grid; place-content: center; gap: 4px; padding: 8px; background: var(--paper); color: var(--ink-soft) }
.card.up { background: var(--sheet); border-color: var(--ink); color: var(--ink); animation: flip .45s ease-out }
.card .num { font: 15px var(--f-head); color: var(--seal) }
.card .glyph { font: 34px/1 var(--f-display); color: var(--accent) }
.card .nm { font: 600 14px var(--f-head) }
.card .ori { font-size: 11px; color: var(--ink-soft) }
.card.rev .glyph { transform: rotate(180deg) }
.slot .kw { font-size: 12px; color: var(--ink-soft); margin-top: 6px; min-height: 2.6em }
@keyframes flip { from { transform: rotateY(90deg) } to { transform: none } }
@media (prefers-reduced-motion: reduce) { .card.up { animation: none } .deck button { transition: none } }

/* 오늘의 운세 */
.subtabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap }
.subtabs button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 20px; padding: 6px 14px; cursor: pointer; font-size: 13px }
.subtabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600 }
.daily { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0; border-top: 1px solid var(--ink) }
.day-item { padding: 16px 16px 16px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px }
.day-item .big { font: 34px/1 var(--f-display); color: var(--accent) }
.day-item h4 { font-size: 15px }
.day-item .yrs { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums }
.day-item p { margin: 6px 0; font-size: 14px }
.stars { color: var(--seal); letter-spacing: 1px; font-size: 13px }
.lucky { font-size: 12px; color: var(--ink-soft) }

/* 오늘의 한 구절 */
.word { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: baseline; margin: -14px 0 28px; padding: 12px 0; border-bottom: 1px solid var(--rule) }
.word .lb { font-size: 11px; letter-spacing: 1.5px; color: var(--seal); grid-row: span 2 }
.word q { font: 17px/1.55 var(--f-head); quotes: "“" "”" }
.word .ref { font-size: 12px; color: var(--ink-soft) }
.verse { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--rule); font: 14px/1.6 var(--f-head) }
.verse .ref { display: block; font: 11px var(--f-body); color: var(--ink-soft) }
.reading blockquote { margin: 4px 0 8px; padding-left: 12px; border-left: 2px solid var(--accent); font-family: var(--f-head) }

/* 바람 한 줄 */
.wish { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-bottom: 28px }
@media (max-width: 820px) { .wish { grid-template-columns: minmax(0, 1fr) } }
.wish h3 { font-size: 18px }
.wish p.lead { margin: 4px 0 12px; color: var(--ink-soft); font-size: 14px }
.wish form { display: flex; gap: 8px }
.wish form input { flex: 1 }
.wishlist { list-style: none; margin: 0; padding: 0 }
.wishlist li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px }
.wishlist .d { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums }
.wishlist button { background: none; border: 1px solid var(--rule); border-radius: 12px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--ink-soft) }
.wishlist li.done button { border-color: var(--seal); color: var(--seal) }
.wishlist li.done .t { color: var(--ink-soft) }
.wishlist .empty { display: block; color: var(--ink-soft); font-size: 13px; border: 0 }

.fb { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; max-width: calc(100vw - 32px) }
.fb-open { box-shadow: 0 2px 10px rgba(0,0,0,.15) }
.fb-panel { display: grid; gap: 10px; width: 320px; max-width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.18) }
.fb-panel[hidden] { display: none }
.fb-stars { display: flex; gap: 4px }
.fb-panel .btn { white-space: nowrap }
.fb-stars button { background: none; border: 0; font-size: 24px; color: var(--seal); cursor: pointer; padding: 0 2px }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-soft); max-width: 72ch }

/* 홈 카탈로그 */
.hero { display: grid; gap: 6px; margin-bottom: 26px; max-width: 64ch }
.hero h2 { font: 30px/1.3 var(--f-display) }
.hero p { margin: 0; color: var(--ink-soft) }
.cat { margin-bottom: 34px; scroll-margin-top: 16px }
.cat-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 0 }
.cat-head h3 { font-size: 20px }
.cat-head span { font-size: 13px; color: var(--ink-soft) }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap: 28px }
.prod { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit }
.prod:hover .pn { color: var(--accent) }
.prod .pn { font: 700 16px var(--f-head) }
.prod .pl { grid-column: 1; font-size: 13px; color: var(--ink-soft) }
.badge { font-size: 11px; letter-spacing: .5px; border-radius: 2px; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap }
.badge.free { border-color: var(--seal); color: var(--seal) }
.back { display: inline-block; margin-bottom: 10px; color: var(--ink-soft); text-decoration: none; font-size: 13px }
.back:hover { color: var(--accent) }

/* 월별 표 · 대운 */
.tbl-wrap { overflow-x: auto; margin-top: 18px }
table.mon { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
table.mon th, table.mon td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top }
table.mon th { font-size: 12px; color: var(--ink-soft); font-weight: 500; border-bottom-color: var(--ink) }
table.mon td.gz { font-family: var(--f-display); font-size: 17px; white-space: nowrap }
table.mon tr.now td { background: color-mix(in srgb, var(--accent) 8%, transparent) }
table.mon .st { color: var(--seal); white-space: nowrap; letter-spacing: 1px }
.dw { display: grid; grid-template-columns: repeat(8, minmax(52px, 1fr)); border: 1px solid var(--rule); min-width: 440px }
.dw div { text-align: center; padding: 8px 2px; border-left: 1px solid var(--rule) }
.dw div:first-child { border-left: 0 }
.dw .age { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums }
.dw .h { font: 22px/1.2 var(--f-display) }
.dw .now { background: color-mix(in srgb, var(--accent) 12%, transparent) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.chips span { border: 1px solid var(--rule); border-radius: 12px; padding: 2px 10px; font-size: 13px; background: var(--sheet) }
.section-t { font-size: 15px; margin-top: 22px }

/* 오늘의 컬러 */
.sw-main { display: grid; grid-template-columns: minmax(96px, 160px) minmax(0, 1fr); gap: 18px; align-items: center; margin-top: 4px }
.sw-main .chip { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--rule); box-shadow: inset 0 0 0 6px var(--sheet) }
.sw-main .nm { font: 26px/1.2 var(--f-display) }
.sw-main .hex { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: .5px }
.sw-rows { display: grid; gap: 0; margin-top: 18px; border-top: 1px solid var(--ink) }
.sw-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: center }
.sw-row .k { font-size: 13px; color: var(--ink-soft) }
.sw-set { display: flex; flex-wrap: wrap; gap: 10px }
.sw-set span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px }
.sw-set i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); display: inline-block }
.color-band { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 16px; margin-bottom: 30px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); text-decoration: none; color: inherit }
.color-band:hover { border-color: var(--accent) }
.color-band .dots { display: flex }
.color-band .dots i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--sheet); margin-left: -8px; display: inline-block }
.color-band .dots i:first-child { margin-left: 0 }
.color-band .tx { flex: 1; min-width: 200px; font-size: 14px }
.color-band .tx b { font-family: var(--f-head); font-size: 16px }
.color-band .go { font-size: 13px; color: var(--accent); font-weight: 600 }
.sw-row.avoid .sw-set span { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--rule) }
</style>

</head>
<body>
<div class="wrap">
  <header class="mast">
    <a class="brand" href="#home" style="text-decoration:none;color:inherit">
      <div class="seal" aria-hidden="true"><span>運</span><span>勢</span></div>
      <div>
        <h1>운세 라운지</h1>
        <p>만세력으로 계산하고, AI가 풀어 드립니다</p>
      </div>
    </a>
    <div class="today" id="todayBox"></div>
  </header>

  <nav class="tabs" aria-label="메뉴" id="catNav"></nav>

  <aside class="word" aria-label="오늘의 한 구절">
    <span class="lb">오늘의<br>한 구절</span>
    <q id="wordText"></q>
    <span class="ref" id="wordRef"></span>
  </aside>

  <main id="home"></main>
  <main id="view" hidden></main>

  <footer>
    운세 콘텐츠는 재미와 참고를 위한 것이며, 건강·법률·투자 판단의 근거가 될 수 없습니다.
    성경 구절은 원문의 뜻을 살려 쉬운 우리말로 옮겨 실었습니다.
    <span id="aiNote">AI 풀이는 보는 사람의 Claude 계정으로 생성되며, 처음 누를 때 사용 동의를 묻습니다.</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.4.0/dist/korean-lunar-calendar.min.js"></script>
<script>
/* ================= 기초 데이터 ================= */
const STEM = "甲乙丙丁戊己庚辛壬癸", STEM_K = "갑을병정무기경신임계";

function relation(me, other) {
  if (me === other) return "same";
  if ((other + 1) % 5 === me) return "in";
  if ((me + 1) % 5 === other) return "sik";
  if ((me + 2) % 5 === other) return "jae";
  return "gwan";
}

function gungResult(a, b, isExample) {
  const pa = pillarsOf(...a.split("-").map(Number), null), pb = pillarsOf(...b.split("-").map(Number), null);
  const ea = stemEl(pa.day[0]), eb = stemEl(pb.day[0]), r = relation(ea, eb), facts = [];
  const relText = {
    same: [72, `두 사람의 일간이 같은 ${EL[ea]} 기운입니다. 친구처럼 편하지만 고집이 부딪칠 수 있습니다.`],
    in: [86, `상대의 ${EL[eb]}이 나의 ${EL[ea]}을 살려 줍니다(상생). 상대에게서 힘과 위로를 얻는 관계입니다.`],
    sik: [84, `나의 ${EL[ea]}이 상대의 ${EL[eb]}을 살려 줍니다(상생). 내가 아끼고 챙겨 주는 관계입니다.`],
    jae: [66, `나의 ${EL[ea]}이 상대의 ${EL[eb]}을 다스립니다(상극). 내가 이끄는 구도라 배려의 균형이 중요합니다.`],

  }[r];
  let score = relText[0]; facts.push(relText[1]);

  else if (SAMHAP.some(g => g.includes(ya) && g.includes(yb))) { score += 10; facts.push(`${ANIMAL[ya]}띠와 ${ANIMAL[yb]}띠는 삼합(三合)으로, 함께하면 일이 잘 풀리는 사이입니다.`); }
  else if (YUKHAP.some(([x, y]) => (x === ya && y === yb) || (x === yb && y === ya))) { score += 8; facts.push(`${ANIMAL[ya]}띠와 ${ANIMAL[yb]}띠는 육합(六合)으로, 서로 끌리는 인연입니다.`); }
  else if (mod(ya - yb, 12) === 6) { score -= 10; facts.push(`${ANIMAL[ya]}띠와 ${ANIMAL[yb]}띠는 상충(相沖)입니다. 다툼은 짧게, 화해는 빨리 하세요.`); }

    <div class="score"><b>${score}</b><span>점 / 100</span></div>
    <div class="pair">${who(pa, "나")}<div class="rel">${r === "same" ? "비화" : (r === "in" || r === "sik") ? "상생" : "상극"}</div>${who(pb, "상대")}</div>

    <div class="reading" id="gReading">${md(fb())}</div>`;
  $("gAsk").onclick = () => runAI({
    prompt: `당신은 명리학 기반 궁합 상담가입니다. 두 사람의 평생 궁합을 풀이해 주세요.

${versePrompt(verse)}\n${TONE}`,

  ["쌍둥이자리","♊","5.21~6.21"],["게자리","♋","6.22~7.22"],["사자자리","♌","7.23~8.22"],["처녀자리","♍","8.23~9.23"],
  ["천칭자리","♎","9.24~10.22"],["전갈자리","♏","10.23~11.22"],["사수자리","♐","11.23~12.24"],["염소자리","♑","12.25~1.19"]
];
function dailyItem(key, big, title, yrs) {
  const r = rng(dateKey + key), pickOne = a => a[Math.floor(r() * a.length)];
  const star = 2 + Math.floor(r() * 4);
  const v = verseFor(dateKey + key + "v", star <= 3 ? ["위로", "구함"] : ["희망", "사랑"]);
  return `<article class="day-item"><div class="big">${big}</div><div>
    <h4>${title} <span class="stars" aria-label="5점 만점에 ${star}점">${stars(star)}</span></h4>
    <div class="yrs">${yrs}</div>
    <p>${pickOne(GEN)} <b>애정</b> ${pickOne(LOVE)} <b>금전</b> ${pickOne(MONEY)}</p>
    <div class="lucky">행운의 색 ${pickOne(COLORS)} · 숫자 ${1 + Math.floor(r() * 9)} · 방향 ${pickOne(DIRS)}</div>
    <div class="verse">${v[3]}<span class="ref">“${v[0]}” — ${v[1]}</span></div></div></article>`;
}
function renderDaily(p) {
  $("view").innerHTML = head(p) + `<h3 style="font-size:18px;margin-bottom:12px">${TM}월 ${TD}일 ${gz(todayP.day)}일</h3><div class="daily" id="dailyList"></div>`;
  $("dailyList").innerHTML = p.sub === "jiji"
    ? ANIMAL.map((a, i) => { const ys = []; for (let y = 1948; y <= 2020; y++) if (mod(y - 4, 12) === i) ys.push(String(y).slice(2));
        return dailyItem("jiji" + i, BR[i], `${a}띠`, ys.slice(-5).join(" · ") + "년생"); }).join("")
    : SIGNS.map((s, i) => dailyItem("astro" + i, s[1], s[0], s[2])).join("");
}

if (SERVER_MODE) $("aiNote").textContent = "AI 풀이를 누르면 풀이에 필요한 생년월일·질문이 AI(Anthropic Claude)로 전송됩니다. 운세 라운지 서버는 이 정보를 저장하지 않습니다.";

/* ================= 의견 보내기 (베타, 서버 모드에서만) ================= */
if (SERVER_MODE) {
  const fb = document.createElement("div");
  fb.className = "fb";
  fb.innerHTML = `<button type="button" class="btn fb-open" id="fbOpen">의견 보내기</button>
    <form class="fb-panel sheet" id="fbForm" hidden>
      <b style="font-family:var(--f-head)">베타 테스트 의견</b>
      <div class="fb-stars" role="radiogroup" aria-label="만족도">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n}점">☆</button>`).join("")}</div>
      <textarea id="fbText" maxlength="1000" placeholder="좋았던 점, 불편했던 점, 틀린 풀이 무엇이든 적어 주세요" aria-label="의견"></textarea>
      <div style="display:flex;gap:8px"><button class="btn" type="submit">보내기</button><button class="btn ghost" type="button" id="fbClose">닫기</button></div><span class="status" id="fbStatus" role="status"></span>
    </form>`;
  document.body.append(fb);
  let rating = 0;
  const paint = () => fb.querySelectorAll(".fb-stars button").forEach(b => { b.textContent = +b.dataset.n <= rating ? "★" : "☆"; b.setAttribute("aria-pressed", +b.dataset.n === rating); });
  fb.querySelectorAll(".fb-stars button").forEach(b => b.onclick = () => { rating = +b.dataset.n; paint(); });
  $("fbOpen").onclick = () => { $("fbForm").hidden = false; $("fbOpen").hidden = true; $("fbText").focus(); };
  $("fbClose").onclick = () => { $("fbForm").hidden = true; $("fbOpen").hidden = false; };
  $("fbForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("fbText").value.trim(); if (!text) { $("fbStatus").textContent = "내용을 적어 주세요."; return; }
    $("fbStatus").textContent = "보내는 중…";
    try {
      const r = await fetch("/api/feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, rating, page: location.hash.slice(1) || "home" }) });
      if (!r.ok) throw 0;
      $("fbText").value = ""; rating = 0; paint(); $("fbStatus").textContent = "고맙습니다. 잘 받았습니다.";
    } catch (err) { $("fbStatus").textContent = "보내지 못했습니다. 잠시 뒤 다시 눌러 주세요."; }
  };
}

/* ================= 바람 한 줄 (이 기기에만 저장) ================= */
const WKEY = "unse-wishes";
let wishes = [];
try { wishes = JSON.parse(localStorage.getItem(WKEY) || "[]"); } catch (e) {}
const saveWishes = () => { try { localStorage.setItem(WKEY, JSON.stringify(wishes)); } catch (e) {} };
function renderWishes() {
  $("wishList").innerHTML = wishes.length
    ? wishes.slice(0, 7).map((w, i) => `<li class="${w.done ? "done" : ""}"><span class="d">${w.d}</span><span class="t">${esc(w.t)}</span><button type="button" data-i="${i}" aria-pressed="${!!w.done}">${w.done ? "이루어졌어요" : "기다리는 중"}</button></li>`).join("")
    : `<li class="empty">아직 적어 둔 바람이 없습니다. 첫 바람을 적으면 여기에 날짜와 함께 남습니다.</li>`;
  $("wishList").querySelectorAll("button").forEach(b => b.onclick = () => { const w = wishes[+b.dataset.i]; w.done = !w.done; saveWishes(); renderWishes(); });
}
$("wishForm").onsubmit = e => {
  e.preventDefault();
  const t = $("wishText").value.trim(); if (!t) return;
  wishes.unshift({ d: `${TM}.${TD}`, t, done: false }); wishes = wishes.slice(0, 30);
  saveWishes(); $("wishText").value = ""; renderWishes();
};
renderWishes();
route();
</script>
