# Railway(Nixpacks) 빌드 설정
#
# nixPkgs로 패키지를 지정하면 Nixpacks가 자동 감지한 Node 설정까지 덮어써
# 이미지 빌드가 즉시 실패한다. 그래서 apt 패키지만 추가한다.
# aptPkgs는 기존 설정에 더해지므로 Node 감지를 건드리지 않고,
# Debian 패키지 이름은 스냅샷에 따라 달라지지 않는다.
#
#   chromium        PDF 내보내기(puppeteer)용 브라우저
#   fonts-noto-cjk  한글 폰트. 없으면 PDF의 한글이 두부(□)로 렌더링된다

[phases.setup]
aptPkgs = ["chromium", "fonts-noto-cjk"]

[variables]
# 위 시스템 chromium을 쓰므로 puppeteer가 자체 Chromium(약 180MB)을 받지 않게 한다.
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
