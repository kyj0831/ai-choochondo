# Railway(Nixpacks) 빌드 설정
#
# PDF 내보내기(puppeteer)용 Chromium을 시스템 패키지로 설치하고,
# puppeteer가 자체 Chromium(약 180MB)을 내려받지 않게 한다.
#
# 한글 폰트는 Nix 패키지로 넣지 않는다. 패키지 이름이 nixpkgs 스냅샷에 따라
# noto-fonts-cjk / noto-fonts-cjk-sans로 달라 빌드가 이름 해석 단계에서
# 즉시 실패한다. 대신 저장소에 폰트 파일을 넣어 리포트 HTML에서 직접 참조한다.

[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "fontconfig"]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/nix/var/nix/profiles/default/bin/chromium"
