# Railway(Nixpacks) 빌드 설정
#
# PDF 내보내기(puppeteer) 때문에 두 가지가 필요하다:
#   1. Chromium 본체 — puppeteer 번들 Chromium은 Nix 환경에서 공유 라이브러리를
#      찾지 못한다. 시스템 chromium을 쓰고 번들 다운로드는 건너뛴다.
#   2. 한글 폰트 — 리눅스 이미지에는 한글 폰트가 없다. 없으면 리포트의
#      한글이 전부 □□□(두부)로 렌더링된다.

[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "fontconfig",
  "noto-fonts-cjk-sans",
]

[phases.install]
# puppeteer가 Chromium(약 180MB)을 내려받지 않도록 한다. 위 시스템 chromium을 쓴다.
cmds = ["PUPPETEER_SKIP_DOWNLOAD=true npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
# lib/export 라우트가 이 경로의 Chromium을 사용한다.
PUPPETEER_EXECUTABLE_PATH = "/nix/var/nix/profiles/default/bin/chromium"
